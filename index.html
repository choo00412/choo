<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>내 즐겨찾기</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f0f2f5">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent; /* 터치 시 파란 깜빡임 제거 */
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
      background-color: #f0f2f5;
      color: #333;
      padding: 20px;
    }
    .header {
      margin-bottom: 24px;
      text-align: center;
    }
    .header h1 {
      font-size: 22px;
      font-weight: 700;
      color: #1a1a1a;
    }
    .link-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .link-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #ffffff;
      padding: 18px 20px;
      border-radius: 16px;
      text-decoration: none;
      color: #1a1a1a;
      font-weight: 600;
      font-size: 17px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }
    .link-btn:active {
      transform: scale(0.98);
      background-color: #f9f9f9;
    }
    .icon {
      font-size: 20px;
      margin-right: 12px;
    }
    .btn-content {
      display: flex;
      align-items: center;
    }
    .arrow {
      color: #c7c7cc;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>🚇 자주 가는 역</h1>
  </div>

  <div class="link-list">
    <!-- 링크 추가 시 아래 형태를 복사해서 사용하세요 -->
    <a href="https://map.naver.com/p/subway/1000/entry/11110" class="link-btn" target="_blank">
      <div class="btn-content">
        <span class="icon">🚆</span>
        <span>오목천역</span>
      </div>
      <span class="arrow">❯</span>
    </a>

    <a href="https://map.naver.com/p/subway/1000/entry/11109" class="link-btn" target="_blank">
      <div class="btn-content">
        <span class="icon">🚆</span>
        <span>고색역</span>
      </div>
      <span class="arrow">❯</span>
    </a>

    <a href="https://map.naver.com/p/subway/1000/entry/1543" class="link-btn" target="_blank">
      <div class="btn-content">
        <span class="icon">🚆</span>
        <span>수원시청역</span>
      </div>
      <span class="arrow">❯</span>
    </a>
  </div>

  <script>
    // 서비스 워커 등록 (PWA 설치를 위해 필요)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</body>
</html>
